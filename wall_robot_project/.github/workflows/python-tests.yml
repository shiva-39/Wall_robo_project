name: CI - Python tests & lint

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt','**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run ruff (linter)
        run: |
          ruff format . || true
          ruff fix . || true
          ruff check .

      - name: Run mypy (type-checker)
        run: |
          mypy .

      - name: Run unit tests
        run: |
          # Run only non-integration tests
          pytest -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
      mosquitto:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883
        options: >-
          --health-cmd "exit 0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt','**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install paho-mqtt slowapi redis

      - name: Wait for services
        run: |
          for i in {1..15}; do
            if redis-cli -h 127.0.0.1 ping | grep -q PONG; then
              echo "Redis is ready"; break
            fi
            echo "Waiting for redis... ($i)"; sleep 2
          done
          sleep 3

      - name: Run integration tests
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          MQTT_HOST: 127.0.0.1
          MQTT_PORT: 1883
        run: |
          # Run integration tests and also migration test to validate migrations
          python -m pytest -q -m integration --junitxml=integration-report.xml || true
          python -m pytest -q tests/test_migration.py || true

      - name: Upload integration artifacts on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: |
            integration-report.xml
            robot_api.log
      - name: Upload full robot log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot_api_full_log
          path: robot_api.log
