version: '3.8'
services:
  app:
    environment:
      - MQTT_ENABLED=1
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./:/app:delegated
      - ./mosquitto/config:/mosquitto/config:ro
      - ./data:/data
    command: uvicorn robot_control_system:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mosquitto
